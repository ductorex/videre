[project]
name = "videre"
version = "0.1.0"
description = "Simple GUI framework based on Pygame"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cursword>=0.1.1",
    "filedial>=0.1.0",
    "fonttools>=4.59.1",
    "freetype-py>=2.5.1",
    "numpy>=2.3.2",
    "pillow>=11.3.0",
    "pygame>=2.6.1",
    "pyperclip>=1.9.0",
    "tqdm>=4.67.1",
    "uharfbuzz>=0.54.1",
    "unicodedataplus>=16.0.0.post1",
    "uniseg>=0.10.1",
]

[project.urls]
Repository = "https://github.com/ductorex/videre"

[dependency-groups]
dev = [
    "poethepoet>=0.44.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-regressions>=2.8.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.10",
    "ty>=0.0.32",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["videre"]

[tool.hatch.build.targets.wheel]
include = ["videre"]

[tool.pytest.ini_options]
markers = ["win_params: arguments for fake_win.__init__"]

[tool.ruff.lint.per-file-ignores]
# Do not complain about unused imports in __init__ files.
"__init__.py" = ["F401"]

[tool.ruff.format]
# Collapse lines even if they contain commas
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[[tool.ty.overrides]]
include = ["videre/core/shaping/shaper.py"]
rules = { "unresolved-import" = "ignore" }

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check --fix"
typecheck = """ty check --output-format concise \
    videre videre_examples videre_tests"""
check = ["format", "lint", "typecheck"]
